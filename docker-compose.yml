services:
  # 关系数据库 + 向量检索一体：pgvector 版 PostgreSQL。
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: lab_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # PG 模式下 main.py 不做 create_all，必须先用 Alembic 建表，否则第一次启动必崩。
    # 迁移偶尔在 PG 刚就绪时抖动，失败交给 restart 策略重试。
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:123456@postgres:5432/lab_agent
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-me-in-production
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      # compose 已起 pgvector 版 PostgreSQL，向量直接用它，不必再引入没定义的 Milvus。
      VECTOR_BACKEND: pgvector
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
